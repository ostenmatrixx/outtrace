name: outtrace-production

services:
  migrate:
    build:
      context: .
      target: api
    command: ['node', 'apps/api/dist/migrate.js']
    environment:
      NODE_ENV: production
      DATABASE_URL_FILE: /run/secrets/database_url
      REDIS_URL_FILE: /run/secrets/redis_url
      OUTTRACE_SEED_DEVELOPMENT: 'false'
    secrets:
      - database_url
      - redis_url
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    restart: 'no'

  api:
    build:
      context: .
      target: api
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: 3000
      API_CORS_ORIGIN: ${OUTTRACE_DASHBOARD_ORIGIN:?set OUTTRACE_DASHBOARD_ORIGIN}
      API_TRUST_PROXY: 'true'
      DATABASE_URL_FILE: /run/secrets/database_url
      REDIS_URL_FILE: /run/secrets/redis_url
      OUTTRACE_SEED_DEVELOPMENT: 'false'
      LOG_LEVEL: ${OUTTRACE_LOG_LEVEL:-info}
    secrets:
      - database_url
      - redis_url
    ports:
      - '${OUTTRACE_API_BIND:-127.0.0.1:3000}:3000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    restart: unless-stopped

  worker:
    build:
      context: .
      target: worker
    depends_on:
      migrate:
        condition: service_completed_successfully
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL_FILE: /run/secrets/database_url
      REDIS_URL_FILE: /run/secrets/redis_url
      SLACK_WEBHOOK_URLS_JSON_FILE: /run/secrets/slack_webhook_urls
      DASHBOARD_BASE_URL: ${OUTTRACE_DASHBOARD_ORIGIN:?set OUTTRACE_DASHBOARD_ORIGIN}
      WORKER_HEALTH_HOST: 0.0.0.0
      WORKER_HEALTH_PORT: 3001
      LOG_LEVEL: ${OUTTRACE_LOG_LEVEL:-info}
    secrets:
      - database_url
      - redis_url
      - slack_webhook_urls
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 45s
    restart: unless-stopped

  dashboard:
    build:
      context: .
      target: dashboard
      args:
        VITE_API_BASE_URL: ${OUTTRACE_PUBLIC_API_URL:?set OUTTRACE_PUBLIC_API_URL}
    environment:
      OUTTRACE_PUBLIC_API_URL: ${OUTTRACE_PUBLIC_API_URL:?set OUTTRACE_PUBLIC_API_URL}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '${OUTTRACE_DASHBOARD_BIND:-127.0.0.1:8080}:8080'
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:8080/healthz']
      interval: 10s
      timeout: 3s
      retries: 6
    read_only: true
    tmpfs:
      - /tmp:uid=101,gid=101,mode=1770
      - /etc/nginx/conf.d:uid=101,gid=101,mode=0755
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

secrets:
  database_url:
    file: ${OUTTRACE_DATABASE_URL_FILE:?set OUTTRACE_DATABASE_URL_FILE}
  redis_url:
    file: ${OUTTRACE_REDIS_URL_FILE:?set OUTTRACE_REDIS_URL_FILE}
  slack_webhook_urls:
    file: ${OUTTRACE_SLACK_WEBHOOK_URLS_FILE:?set OUTTRACE_SLACK_WEBHOOK_URLS_FILE}
